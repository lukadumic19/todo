  const [note,setNote] = useState('');
  return html`
    <${Sheet} onClose=${onClose} label="Hvad blev besluttet?">
      <h2>Hvad blev besluttet?</h2>
      <p className="taskref">${task.title}</p>
      <div className="field">
        <input className="input" value=${note} autoFocus=${true} placeholder="Én linje — må gerne stå tom"
               onInput=${(e)=>setNote(e.target.value)}
               onKeyDown=${(e)=>{if(e.key==='Enter'){e.preventDefault(); onSave(note.trim());}}}/>
      </div>
      <p className="hint">Skriver du en linje, journaliseres den som en beslutning med dagens dato — og opgaven kobles til den.</p>
      <div className="sheet-actions">
        <button className="btn btn-primary" onClick=${()=>onSave(note.trim())}>Gem</button>
        <button className="btn btn-ghost" onClick=${onSkip}>Spring over</button>
      </div>
    <//>`;
}

function TypeChooserSheet({onPick, onClose}){
  const rows = [
    ['task', Icon.circlecheck, 'Opgave', 'Noget der skal gøres'],
    ['decision', Icon.stamp, 'Beslutning', 'Journalisér hvad der er besluttet'],
    ['agreement', Icon.calendar, 'Aftale', 'Hvad er aftalt, og med hvem'],
    ['note', Icon.doc, 'Note', 'Hurtig registrering'],
    ['standard', Icon.book, 'Standard', 'Fast fremgangsmåde eller procedure'],
    ['idea', Icon.bulb, 'Idé', 'Parkér en tanke — beslut senere']
  ];
  return html`
    <${Sheet} onClose=${onClose} label="Hvad vil du tilføje?">
      <h2>Hvad vil du tilføje?</h2>
      ${rows.map(([k,Ic,label,sub])=>html`
        <button key=${k} className=${'menu-item'+(k==='idea'?' light':'')} onClick=${()=>onPick(k)}>
          <${Ic}/>
          <span><span className="mi-title">${label}</span><span className="mi-sub">${sub}</span></span>
        </button>`)}
    <//>`;
}

function ConfirmSheet({title, body, confirmLabel, onConfirm, onClose}){
  return html`
    <${Sheet} onClose=${onClose} label=${title}>
      <h2>${title}</h2>
      ${body ? html`<p className="taskref">${body}</p>` : null}
      <div className="sheet-actions">
        <button className="btn btn-danger" onClick=${onConfirm}>${confirmLabel}</button>
        <button className="btn btn-ghost" onClick=${onClose}>Annuller</button>
      </div>
    <//>`;
}

function VersionSheet({version, onClose}){
  return html`
    <${Sheet} onClose=${onClose} label=${'Version '+version.version}>
      <h2>${version.title}</h2>
      <p className="taskref">Version ${version.version} · gemt ${fmtDate(version.savedAt)} · skrivebeskyttet</p>
      ${STD_FIELDS.map(([k,label])=>html`<${Field} key=${k} label=${label} value=${(version.fields||{})[k]}/>`)}
      <div className="sheet-actions">
        <button className="btn btn-ghost" onClick=${onClose}>Luk</button>
      </div>
    <//>`;
}

/* ================= App ================= */

function App(){
  const [data,setData] = useState(loadData);
  const [stack,setStack] = useState([{name:'today'}]);
  const [sheet,setSheet] = useState(null);
  const [decFilter,setDecFilter] = useState(null);
  const [stdFilter,setStdFilter] = useState(null);
  const [stdStatusFilter,setStdStatusFilter] = useState('all');
  const [catSection,setCatSection] = useState('tasks');
  const [searchQuery,setSearchQuery] = useState('');
  const [searchType,setSearchType] = useState('all');

  useEffect(()=>persist(data),[data]);

  /* ---- Tema og personlige indstillinger ---- */
  const settings = Object.assign({}, DEFAULT_SETTINGS, data.settings||{});
  const [sysDark,setSysDark] = useState(()=>!!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches));
  useEffect(()=>{
    if(!window.matchMedia) return;
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const on = (e)=>setSysDark(e.matches);
    if(mq.addEventListener) mq.addEventListener('change', on); else mq.addListener(on);
    return ()=>{ if(mq.removeEventListener) mq.removeEventListener('change', on); else mq.removeListener(on); };
  },[]);
  const isDark = settings.theme==='dark' || (settings.theme==='auto' && sysDark);
  useEffect(()=>{
    document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
    const acc = ACCENTS[settings.accent] || ACCENTS.petrol;
    document.documentElement.style.setProperty('--accent', isDark ? acc.dark : acc.light);
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.content = isDark ? '#171B19' : '#EEF1EE';
  },[isDark, settings.accent]);

  const view = stack[stack.length-1];
  const push = (v)=>setStack(s=>[...s,v]);
  const pop = ()=>setStack(s=>s.length>1?s.slice(0,-1):s);
  const resetTo = (name)=>setStack([{name}]);

  const patchItem = (id,patch)=>setData(d=>({...d, items:d.items.map(i=>i.id===id?{...i,...patch, updatedAt:nowIso()}:i)}));

  const openItem = (item)=>push({name:'item', id:item.id});
  const openCategory = (id)=>{ setCatSection('tasks'); push({name:'category', id}); };
  const openSearch = ()=>push({name:'search'});
  const openResult = (r)=>{
    if(r.kind==='event') push({name:'calendar', date:r.obj.date});
    else push({name:'item', id:r.id});
  };

  /* ---- API til skærme og ark ---- */
  const api = {
    /* Opgaver */
    toggleDone: (t)=>{
      if(t.status==='done') patchItem(t.id,{status:'not_started', completedAt:null});
      else patchItem(t.id,{status:'done', completedAt:nowIso(), myDay:false});
    },
    setTaskStatus: (t,s)=>{
      if(s===t.status) return;
      if(s==='done'){ patchItem(t.id,{status:'done', completedAt:nowIso(), myDay:false}); return; }
      if(s==='waiting'){ setSheet({type:'waiting', itemId:t.id}); return; }
      patchItem(t.id,{status:s, completedAt:null});
    },
    toggleMyDay: (t)=>patchItem(t.id,{myDay:!t.myDay, myDayAt: !t.myDay?nowIso():null}),

    /* Idéer */
    startConvertIdea: (t)=>setSheet({type:'convertIdea', itemId:t.id}),

    /* Opret/rediger */
    startAdd: (categoryId, section)=>{
      const direct = {ideas:'idea', decisions:'decision', agreements:'agreement', notes:'note', standards:'standard'}[section];
      if(direct) setSheet({type:'form', formType:direct, categoryId});
      else setSheet({type:'chooser', categoryId});
    },
    startEdit: (item)=>setSheet({type:'form', formType: item.type==='task' ? (item.idea?'idea':'task') : item.type, itemId:item.id, categoryId:item.categoryId}),
    startTaskFrom: (origin)=>setSheet({type:'form', formType:'task', categoryId:origin.categoryId, originId:origin.id}),

    /* Opfølgning */
    startFollowUp: (item)=>setSheet({type:'followUp', itemId:item.id}),
    clearFollowUp: (id)=>patchItem(id,{followUp:null}),

    /* Standarder */
    setStandardStatus: (item,s)=>{ if(s!==item.status) patchItem(item.id,{status:s}); },
    showVersion: (item,v)=>setSheet({type:'version', itemId:item.id, version:v}),

    /* Slet */
    confirmDelete: (item)=>setSheet({type:'confirmDel', itemId:item.id}),

    /* Kategorier */
    renameCategory: (id,name)=>setData(d=>({...d, categories:d.categories.map(c=>c.id===id?{...c,name:name.trim()||c.name}:c)})),
    recolorCategory: (id,color)=>setData(d=>({...d, categories:d.categories.map(c=>c.id===id?{...c,color}:c)})),
    moveCategory: (id,dir)=>setData(d=>{
      const cats = [...d.categories].sort((a,b)=>a.order-b.order);
      const idx = cats.findIndex(c=>c.id===id);
      const j = idx+dir;
      if(idx<0 || j<0 || j>=cats.length) return d;
      const tmp = cats[idx]; cats[idx] = cats[j]; cats[j] = tmp;
      return {...d, categories: cats.map((c,i)=>({...c, order:i}))};
    }),
    addCategory: ()=>setData(d=>{
      const order = d.categories.length ? Math.max(...d.categories.map(c=>c.order))+1 : 0;
      return {...d, categories:[...d.categories, {id:uid(), name:'Ny kategori', color:PALETTE[order%PALETTE.length], order}]};
    }),
    confirmDeleteCategory: (c)=>setSheet({type:'confirmCat', categoryId:c.id, name:c.name}),

    /* Personlige indstillinger */
    setSetting: (k,v)=>setData(d=>({...d, settings: Object.assign({}, DEFAULT_SETTINGS, d.settings||{}, {[k]:v})})),

    /* Kalender */
    startEvent: (date)=>setSheet({type:'event', initial:{date}}),
    startEditEvent: (e)=>setSheet({type:'event', initial:e}),
    startCalImport: ()=>setSheet({type:'calImport'}),
    importIcs: (calendar, text)=>{
      let added = null;
      try{ added = icsToEvents(text, calendar); }catch(e){}
      if(!added || !added.length){ setSheet({type:'icsResult', calendar, added:0}); return; }
      setData(d=>({...d, events:[...(d.events||[]).filter(e=>!(e.source==='ics' && e.calendar===calendar)), ...added]}));
      setSheet({type:'icsResult', calendar, added:added.length});
    },

    /* Backup */
    exportData: ()=>{
      const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'opgaver-backup-'+todayStr()+'.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    },
    startImport: (text)=>{
      let parsed = null;
      try{ parsed = JSON.parse(text); }catch(e){}
      const m = parsed ? (isV2(parsed) ? (Array.isArray(parsed.events)?parsed:{...parsed, events:[]}) : (isV1(parsed) ? migrateV1(parsed) : null)) : null;
      if(!m){ setSheet({type:'importError'}); return; }
      setSheet({type:'confirmImport', payload:m});
    }
  };

  const sheetItem = sheet && sheet.itemId ? data.items.find(i=>i.id===sheet.itemId) : null;

  /* ---- Gem fra formularer ---- */
  const saveForm = (formType, values)=>{
    const s = sheet;
    if(s.itemId){
      const item = data.items.find(i=>i.id===s.itemId);
      if(item && item.type==='standard'){
        const changed = item.title!==values.title || JSON.stringify(item.fields||{})!==JSON.stringify(values.fields||{});
        const versions = changed
          ? [...(item.versions||[]), {version:(item.versions||[]).length+1, savedAt:item.updatedAt||item.createdAt, title:item.title, fields:item.fields||{}, status:item.status}]
          : (item.versions||[]);
        patchItem(s.itemId, {...values, versions});
      }else{
        patchItem(s.itemId, values);
      }
      setSheet(null);
      return;
    }
    const type = formType==='idea' ? 'task' : formType;
    const extra = formType==='idea' ? {idea:true} : {};
    const item = newItem(type, s.categoryId, Object.assign(extra, values));
    setData(d=>{
      const relations = s.originId
        ? [...d.relations, {id:uid(), fromId:s.originId, toId:item.id, kind:'skabte'}]
        : d.relations;
      return {...d, items:[...d.items, item], relations};
    });
    setSheet(null);
  };

  const convertIdea = (note)=>{
    const t = sheetItem;
    if(!t){ setSheet(null); return; }
    setData(d=>{
      let items = d.items.map(i=>i.id===t.id?{...i, idea:false, status:'not_started', updatedAt:nowIso()}:i);
      let relations = d.relations;
      if(note){
        const dec = newItem('decision', t.categoryId, {title:t.title, what:note, decidedOn:todayStr()});
        items = [...items, dec];
        relations = [...relations, {id:uid(), fromId:dec.id, toId:t.id, kind:'skabte'}];
      }
      return {...d, items, relations};
    });
    setSheet(null);
  };

  /* ---- Skærmvalg ---- */
  let screen = null;
  if(view.name==='category'){
    screen = html`<${CategoryScreen} data=${data} categoryId=${view.id} section=${catSection}
      onSection=${setCatSection} onBack=${pop} onOpenItem=${openItem} api=${api}/>`;
  }else if(view.name==='item'){
    screen = html`<${ItemScreen} data=${data} itemId=${view.id} onBack=${pop} onOpenItem=${openItem} api=${api}/>`;
  }else if(view.name==='categories'){
    screen = html`<${CategoriesScreen} data=${data} onOpenCategory=${openCategory} onOpenSettings=${()=>push({name:'settings'})} onSearch=${openSearch}/>`;
  }else if(view.name==='calendar'){
    screen = html`<${CalendarScreen} data=${data} initialDate=${view.date} onOpenItem=${openItem} api=${api} onSearch=${openSearch}/>`;
  }else if(view.name==='search'){
    screen = html`<${SearchScreen} data=${data} query=${searchQuery} onQuery=${setSearchQuery}
      typeFilter=${searchType} onTypeFilter=${setSearchType} onBack=${pop} onOpenResult=${openResult}/>`;
  }else if(view.name==='decisions'){
    screen = html`<${DecisionsScreen} data=${data} filter=${decFilter} onFilter=${setDecFilter}
      onOpenItem=${openItem} onSearch=${openSearch}/>`;
  }else if(view.name==='standards'){
    screen = html`<${StandardsScreen} data=${data} filter=${stdFilter} onFilter=${setStdFilter}
      statusFilter=${stdStatusFilter} onStatusFilter=${setStdStatusFilter} onOpenItem=${openItem} onSearch=${openSearch}/>`;
  }else if(view.name==='settings'){
    screen = html`<${SettingsScreen} data=${data} settings=${settings} isDark=${isDark} onBack=${pop} api=${api}/>`;
  }else{
    screen = html`<${TodayScreen} data=${data} settings=${settings} api=${api} onOpenItem=${openItem}
      onOpenSettings=${()=>push({name:'settings'})} onSearch=${openSearch}/>`;
  }

  /* ---- Ark ---- */
  let sheetEl = null;
  if(sheet){
    const close = ()=>setSheet(null);
    if(sheet.type==='chooser'){
      sheetEl = html`<${TypeChooserSheet} onClose=${close}
        onPick=${(k)=>setSheet({type:'form', formType:k, categoryId:sheet.categoryId})}/>`;
    }else if(sheet.type==='form'){
      const initial = sheetItem || {};
      if(sheet.formType==='task'){
        const origin = sheet.originId ? data.items.find(i=>i.id===sheet.originId) : null;
        sheetEl = html`<${TaskForm} initial=${initial} onClose=${close} onSave=${(v)=>saveForm('task', v)}
          title=${initial.id?'Rediger opgave':'Ny opgave'}
          contextLine=${origin ? 'Ud fra: '+origin.title : null}/>`;
      }
      else if(sheet.formType==='idea') sheetEl = html`<${IdeaForm} initial=${initial} onClose=${close} onSave=${(v)=>saveForm('idea', v)}/>`;
      else if(sheet.formType==='decision') sheetEl = html`<${DecisionForm} initial=${initial} onClose=${close} onSave=${(v)=>saveForm('decision', v)}/>`;
      else if(sheet.formType==='agreement') sheetEl = html`<${AgreementForm} initial=${initial} onClose=${close} onSave=${(v)=>saveForm('agreement', v)}/>`;
      else if(sheet.formType==='note') sheetEl = html`<${NoteForm} initial=${initial} onClose=${close} onSave=${(v)=>saveForm('note', v)}/>`;
      else if(sheet.formType==='standard') sheetEl = html`<${StandardForm} initial=${initial} onClose=${close} onSave=${(v)=>saveForm('standard', v)}/>`;
    }else if(sheet.type==='event'){
      const init = sheet.initial||{};
      sheetEl = html`<${EventForm} initial=${init} onClose=${close}
        onSave=${(v)=>{
          if(init.id){
            setData(d=>({...d, events:(d.events||[]).map(e=>e.id===init.id?{...e,...v}:e)}));
          }else{
            setData(d=>({...d, events:[...(d.events||[]), {id:uid(), source:'manual', icsUid:null, endDate:null, ...v}]}));
          }
          setSheet(null);
        }}
        onDelete=${()=>setSheet({type:'confirmDelEvent', eventId:init.id, title:init.title})}/>`;
    }else if(sheet.type==='confirmDelEvent'){
      sheetEl = html`<${ConfirmSheet} title="Slet begivenheden?" body=${sheet.title} confirmLabel="Slet"
        onConfirm=${()=>{ setData(d=>({...d, events:(d.events||[]).filter(e=>e.id!==sheet.eventId)})); setSheet(null); }}
        onClose=${close}/>`;
    }else if(sheet.type==='calImport'){
      const counts = {
        work: (data.events||[]).filter(e=>e.source==='ics'&&e.calendar==='work').length,
        private: (data.events||[]).filter(e=>e.source==='ics'&&e.calendar==='private').length
      };
      sheetEl = html`<${CalImportSheet} counts=${counts} onClose=${close}
        onPick=${(cal,text)=>api.importIcs(cal,text)}/>`;
    }else if(sheet.type==='icsResult'){
      sheetEl = html`<${Sheet} onClose=${close} label="Import">
        <h2>${sheet.added ? 'Kalender importeret' : 'Ingenting importeret'}</h2>
        <p className="taskref">${sheet.added
          ? sheet.added+' begivenheder blev importeret til '+CAL_LABEL[sheet.calendar]+'.'
          : 'Filen indeholdt ingen begivenheder, der kunne læses. Vælg en .ics-fil eksporteret fra din kalender.'}</p>
        <div className="sheet-actions">
          <button className="btn btn-ghost" onClick=${close}>Luk</button>
        </div>
      <//>`;
    }else if(sheet.type==='convertIdea' && sheetItem){
      sheetEl = html`<${ConvertIdeaSheet} task=${sheetItem} onClose=${close}
        onSave=${(note)=>convertIdea(note)} onSkip=${()=>convertIdea('')}/>`;
    }else if(sheet.type==='waiting' && sheetItem){
      sheetEl = html`<${WaitingSheet} task=${sheetItem} onClose=${close}
        onSave=${(who,due)=>{
          patchItem(sheetItem.id,{status:'waiting', completedAt:null, waitingFor:who,
            followUp: due ? {due, note: who ? 'Afventer '+who : ''} : sheetItem.followUp});
          setSheet(null);
        }}/>`;
    }else if(sheet.type==='followUp' && sheetItem){
      sheetEl = html`<${FollowUpSheet} item=${sheetItem} onClose=${close}
        onSave=${(fu)=>{ patchItem(sheetItem.id,{followUp:fu}); setSheet(null); }}/>`;
    }else if(sheet.type==='version' && sheetItem){
      sheetEl = html`<${VersionSheet} version=${sheet.version} onClose=${close}/>`;
    }else if(sheet.type==='confirmDel' && sheetItem){
      const delTitle = {task: sheetItem.idea ? 'Slet idéen?' : 'Slet opgaven?', decision:'Slet beslutningen?', agreement:'Slet aftalen?', note:'Slet noten?'}[sheetItem.type] || 'Slet?';
      sheetEl = html`<${ConfirmSheet} title=${delTitle} body=${sheetItem.title} confirmLabel="Slet"
        onConfirm=${()=>{
          const delId = sheet.itemId;
          setData(d=>({...d,
            items: d.items.filter(i=>i.id!==delId),
            relations: d.relations.filter(r=>r.fromId!==delId && r.toId!==delId)
          }));
          setSheet(null);
          if(view.name==='item' && view.id===delId) pop();
        }}
        onClose=${close}/>`;
    }else if(sheet.type==='confirmCat'){
      sheetEl = html`<${ConfirmSheet} title="Slet kategorien?" body=${sheet.name} confirmLabel="Slet"
        onConfirm=${()=>{ setData(d=>({...d, categories:d.categories.filter(c=>c.id!==sheet.categoryId)})); setSheet(null); }}
        onClose=${close}/>`;
    }else if(sheet.type==='confirmImport'){
      const p = sheet.payload;
      sheetEl = html`<${ConfirmSheet} title="Importér backup?"
        body=${'Filen indeholder '+p.items.length+' elementer i '+p.categories.length+' kategorier. Import erstatter alle nuværende data.'}
        confirmLabel="Importér"
        onConfirm=${()=>{ setData(p); setSheet(null); resetTo('today'); }}
        onClose=${close}/>`;
    }else if(sheet.type==='importError'){
      sheetEl = html`<${Sheet} onClose=${close} label="Filen kunne ikke læses">
        <h2>Filen kunne ikke læses</h2>
        <p className="taskref">Vælg en JSON-fil, der er eksporteret fra denne app.</p>
        <div className="sheet-actions">
          <button className="btn btn-ghost" onClick=${close}>Luk</button>
        </div>
      <//>`;
    }
  }

  /* ---- Bundnavigation ---- */
  const navRoot = {today:'today', calendar:'calendar', categories:'categories', category:'categories', decisions:'decisions', standards:'standards'}[view.name] || null;
  const nav = html`
    <nav className="nav" aria-label="Hovednavigation">
      <div className="nav-inner">
        <button className=${'nav-item'+(navRoot==='today'?' active':'')} onClick=${()=>resetTo('today')}>
          <${Icon.sun}/> I dag
        </button>
        <button className=${'nav-item'+(navRoot==='calendar'?' active':'')} onClick=${()=>resetTo('calendar')}>
          <${Icon.calendar}/> Kalender
        </button>
        <button className=${'nav-item'+(navRoot==='categories'?' active':'')} onClick=${()=>resetTo('categories')}>
          <${Icon.grid}/> Kategorier
        </button>
        <button className=${'nav-item'+(navRoot==='decisions'?' active':'')} onClick=${()=>resetTo('decisions')}>
          <${Icon.stamp}/> Beslutninger
        </button>
        <button className=${'nav-item'+(navRoot==='standards'?' active':'')} onClick=${()=>resetTo('standards')}>
          <${Icon.book}/> Standarder
        </button>
      </div>
    </nav>`;

  return html`<div>${screen}${nav}${sheetEl}</div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);

/* ================= Service worker ================= */
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
